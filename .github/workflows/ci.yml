# プルリクエストごとに、型チェック・Biome・ユニットテスト・ビルドを実行する。
# デプロイ前にも deploy.yml から呼ばれ、ここが通らないとデプロイしない。
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint / Format
        run: npx biome ci .
      - name: Unit test
        run: npm test
      - name: Build
        run: npm run build

